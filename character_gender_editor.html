<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Character Gender Editor</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap"
            rel="stylesheet">
        <style>
        :root {
            --bg-dark: #0a0e1a;
            --bg-panel: #151925;
            --text-primary: #e8eaed;
            --text-secondary: #9195a0;
            --accent-gold: #d4af37;
            --accent-blue: #4a90e2;
            --accent-pink: #ec4899;
            --accent-purple: #8b5cf6;
            --border: #2a2f3e;
            --accent-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            padding: 100px 40px 40px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 80px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        .subtitle { display: none; }

        .stats {
            display: flex;
            gap: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .stat-item {
            background: transparent;
            padding: 0;
            border-radius: 0;
        }

        .stat-item strong {
            color: var(--text-primary);
            margin-left: 5px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 16px 20px;
            background: var(--bg-panel);
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--accent-gold);
            color: var(--bg-dark);
            border-color: var(--accent-gold);
        }

        .btn.active {
            background: var(--accent-gold);
            color: var(--bg-dark);
            border-color: var(--accent-gold);
        }

        .btn-save {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
            font-weight: bold;
        }

        .btn-save:hover {
            background: #3a7bc8;
            border-color: #3a7bc8;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .character-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px;
            transition: border-color 0.3s;
        }

        .character-card.selected {
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .character-card.gender-M {
            border-left: 4px solid var(--accent-blue);
        }

        .character-card.gender-F {
            border-left: 4px solid var(--accent-pink);
        }

        .character-card.gender-C {
            border-left: 4px solid var(--accent-purple);
        }

        .character-name {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .character-stats {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-family: 'Space Mono', monospace;
        }

        .gender-options {
            display: flex;
            gap: 10px;
        }

        .gender-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Space Mono', monospace;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 0;
        }

        .gender-btn:hover {
            border-color: var(--accent-gold);
        }

        .gender-btn.selected {
            font-weight: bold;
            color: white;
        }

        .gender-btn.selected.gender-M {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .gender-btn.selected.gender-F {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
        }

        .gender-btn.selected.gender-C {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
        }

        .notes-input {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: 'Crimson Pro', serif;
            font-size: 0.9em;
            border-radius: 0px;
        }

        .notes-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            font-family: 'Space Mono', monospace;
            font-size: 0.8em;
            letter-spacing: 0.5px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message.success {
            background: var(--bg-panel);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .message.error {
            background: var(--bg-panel);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .progress-bar {
            height: 2px;
            background: var(--border);
            border-radius: 0;
            margin-top: 0;
            overflow: hidden;
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            z-index: 101;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gold);
            transition: width 0.3s;
        }
    </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>CHARACTER GENDER EDITOR</h1>
                <p class="subtitle">Assign gender to each character</p>
                <div class="stats">
                    <div class="stat-item">Total: <strong
                            id="stat-total">0</strong></div>
                    <div class="stat-item">Assigned: <strong
                            id="stat-assigned">0</strong></div>
                    <div class="stat-item">Remaining: <strong
                            id="stat-remaining">0</strong></div>
                </div>
            </header>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="controls">
                <div class="filter-group">
                    <button class="btn active" data-filter="all">All</button>
                    <button class="btn"
                        data-filter="unassigned">Unassigned</button>
                    <button class="btn" data-filter="M">Male</button>
                    <button class="btn" data-filter="F">Female</button>
                    <button class="btn" data-filter="C">Collective</button>
                </div>
                <button class="btn btn-save" onclick="saveMetadata()">Save
                    All</button>
            </div>

            <div class="characters-grid" id="characters-grid"></div>
        </div>

        <script>
        let metadata = null;
        let currentFilter = 'all';

        async function loadMetadata() {
            try {
                const response = await fetch('characters_metadata.json');
                metadata = await response.json();
                updateStats();
                renderCharacters();
            } catch (error) {
                showMessage('Error loading metadata: ' + error.message, 'error');
            }
        }

        function updateStats() {
            const total = metadata.characters.length;
            const assigned = metadata.characters.filter(c => c.gender !== null).length;
            const remaining = total - assigned;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-assigned').textContent = assigned;
            document.getElementById('stat-remaining').textContent = remaining;
            
            const progress = total > 0 ? (assigned / total) * 100 : 0;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function renderCharacters() {
            const grid = document.getElementById('characters-grid');
            
            let filtered = metadata.characters;
            if (currentFilter === 'unassigned') {
                filtered = filtered.filter(c => c.gender === null);
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(c => c.gender === currentFilter);
            }
            
            filtered.sort((a, b) => b.dialogue_count - a.dialogue_count);
            
            grid.innerHTML = '';
            
            filtered.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = 'character-card';
                if (char.gender) {
                    card.classList.add(`gender-${char.gender}`);
                }
                
                card.innerHTML = `
                    <div class="character-name">${char.name}</div>
                    <div class="character-stats">Dialogues <strong style="color:var(--text-primary);">${char.dialogue_count}</strong></div>
                    <div class="gender-options">
                        <button class="gender-btn ${char.gender === 'M' ? 'selected gender-M' : ''}" 
                                onclick="setGender('${char.name}', 'M')">♂ Male</button>
                        <button class="gender-btn ${char.gender === 'F' ? 'selected gender-F' : ''}" 
                                onclick="setGender('${char.name}', 'F')">♀ Female</button>
                        <button class="gender-btn ${char.gender === 'C' ? 'selected gender-C' : ''}" 
                                onclick="setGender('${char.name}', 'C')">♀♂ Collective</button>
                    </div>
                    <input type="text" class="notes-input" placeholder="Notes (optional)" 
                           value="${char.notes || ''}" 
                           onchange="setNotes('${char.name}', this.value)">
                `;
                
                grid.appendChild(card);
            });
        }

        function setGender(name, gender) {
            const char = metadata.characters.find(c => c.name === name);
            if (char) {
                char.gender = char.gender === gender ? null : gender;
                updateStats();
                renderCharacters();
            }
        }

        function setNotes(name, notes) {
            const char = metadata.characters.find(c => c.name === name);
            if (char) {
                char.notes = notes;
            }
        }

        function filterCharacters(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('[data-filter]').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderCharacters();
        }

        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentFilter = e.target.dataset.filter;
                document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderCharacters();
            });
        });

        async function saveMetadata() {
            try {
                const response = await fetch('save_metadata.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(metadata)
                });
                
                if (response.ok) {
                    showMessage('Metadata saved successfully!', 'success');
                } else {
                    downloadMetadata();
                }
            } catch (error) {
                downloadMetadata();
            }
        }

        function downloadMetadata() {
            const blob = new Blob([JSON.stringify(metadata, null, 2)], 
                                    { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'characters_metadata.json';
            link.click();
            URL.revokeObjectURL(url);
            showMessage('Downloaded metadata file', 'success');
        }

        function showMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            setTimeout(() => message.remove(), 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveMetadata();
            }
        });

        loadMetadata();
    </script>
    </body>
</html>
